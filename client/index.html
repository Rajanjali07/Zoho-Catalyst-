<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <h1>Find a product</h1>
  <p>Search by name, SKU, style number or category.</p>
  <div class="search">
    <input id="q" type="search" placeholder="Try &ldquo;ring&rdquo; or a SKU" autocomplete="off" aria-label="Search products">
    <button id="go" type="button">Search</button>
  </div>
</header>
<main>
  <p id="status" role="status" aria-live="polite"></p>
  <ul id="results" class="results"></ul>
</main>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button id="close" class="x" type="button" aria-label="Close">&times;</button>
    <div id="m-body"></div>
    <div class="actions"><button id="pdf" type="button">Download PDF</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
